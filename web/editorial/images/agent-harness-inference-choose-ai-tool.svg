<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Choose an AI tool for the whole job</title><desc id="desc">Inference happens within a working harness that provides context, tools, state, and controls. A practical trial checks source accuracy, the saved result, and recovery.</desc>
<rect width="1200" height="900" fill="#fcfaf6"/>
<text x="72" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#246344">AI SUPERPOWER / A PRACTICAL TOOL TRIAL</text>
<text x="72" y="152" font-family="Arial,sans-serif" font-weight="700" font-size="54" fill="#192d27">Choose for the whole job.</text>
<text x="75" y="207" font-family="Arial,sans-serif" font-size="27" fill="#456255">Understand the model call and the work around it.</text>
<rect x="72" y="253" width="1056" height="336" rx="24" fill="#eaf0d9" stroke="#92a88b" stroke-width="2"/>
<text x="110" y="303" font-family="Arial,sans-serif" font-weight="700" font-size="23" letter-spacing="2" fill="#246344">AGENT HARNESS</text>
<text x="110" y="354" font-family="Arial,sans-serif" font-size="27" fill="#192d27">Context · Tools · State · Controls</text>
<rect x="110" y="391" width="980" height="150" rx="15" fill="#192d27"/>
<text x="146" y="447" font-family="Arial,sans-serif" font-weight="700" font-size="31" fill="#fcfaf6">Model inference</text>
<text x="146" y="493" font-family="Arial,sans-serif" font-size="26" fill="#eaf0d9">Current input → Next response or tool request</text>
<g font-family="Arial,sans-serif">
<text x="74" y="653" font-size="20" font-weight="700" letter-spacing="2" fill="#246344">REVIEW THREE OBSERVABLE RESULTS</text>
<circle cx="101" cy="714" r="27" fill="#f4b697"/><text x="101" y="723" text-anchor="middle" font-size="25" font-weight="700" fill="#192d27">1</text>
<text x="148" y="722" font-size="29" fill="#192d27">Are the facts faithful to the source?</text>
<circle cx="101" cy="782" r="27" fill="#f4b697"/><text x="101" y="791" text-anchor="middle" font-size="25" font-weight="700" fill="#192d27">2</text>
<text x="148" y="790" font-size="29" fill="#192d27">Can you open the saved result?</text>
<circle cx="101" cy="850" r="27" fill="#f4b697"/><text x="101" y="859" text-anchor="middle" font-size="25" font-weight="700" fill="#192d27">3</text>
<text x="148" y="858" font-size="29" fill="#192d27">Can the workflow recover clearly?</text>
</g></svg>
