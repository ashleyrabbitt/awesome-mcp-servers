<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Six steps: A small, dependable interface</title><desc id="desc">Define the task: Choose one safe useful action.; Write the contract: Inputs, outputs and errors.; Implement the read: Keep private data out.; Publish the map: Link real docs and endpoints.; Test failure paths: Verify status and response.; Observe real use: Maintain what clients need.</desc><rect width="1200" height="1000" fill="#eaf0d9"/><text x="56" y="66" fill="#246344" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="56" dy="0">AI SUPERPOWER / PRACTICAL WORKFLOW</tspan></text><text x="56" y="128" fill="#23312c" font-size="40" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="56" dy="0">From a useful question to a checked result</tspan></text><rect x="56" y="190" width="532" height="220" rx="16" fill="white" stroke="#246344" stroke-width="1.5"/><circle cx="101" cy="235" r="24" fill="#246344"/><text x="88" y="243" fill="white" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="88" dy="0">01</tspan></text><text x="141" y="242" fill="#23312c" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="141" dy="0">Define the task</tspan></text><text x="88" y="310" fill="#23312c" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="88" dy="0">Choose one safe useful action.</tspan></text><rect x="610" y="190" width="532" height="220" rx="16" fill="white" stroke="#246344" stroke-width="1.5"/><circle cx="655" cy="235" r="24" fill="#246344"/><text x="642" y="243" fill="white" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="642" dy="0">02</tspan></text><text x="695" y="242" fill="#23312c" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="695" dy="0">Write the contract</tspan></text><text x="642" y="310" fill="#23312c" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="642" dy="0">Inputs, outputs and errors.</tspan></text><rect x="56" y="435" width="532" height="220" rx="16" fill="white" stroke="#246344" stroke-width="1.5"/><circle cx="101" cy="480" r="24" fill="#246344"/><text x="88" y="488" fill="white" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="88" dy="0">03</tspan></text><text x="141" y="487" fill="#23312c" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="141" dy="0">Implement the read</tspan></text><text x="88" y="555" fill="#23312c" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="88" dy="0">Keep private data out.</tspan></text><rect x="610" y="435" width="532" height="220" rx="16" fill="white" stroke="#246344" stroke-width="1.5"/><circle cx="655" cy="480" r="24" fill="#246344"/><text x="642" y="488" fill="white" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="642" dy="0">04</tspan></text><text x="695" y="487" fill="#23312c" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="695" dy="0">Publish the map</tspan></text><text x="642" y="555" fill="#23312c" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="642" dy="0">Link real docs and endpoints.</tspan></text><rect x="56" y="680" width="532" height="220" rx="16" fill="white" stroke="#246344" stroke-width="1.5"/><circle cx="101" cy="725" r="24" fill="#246344"/><text x="88" y="733" fill="white" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="88" dy="0">05</tspan></text><text x="141" y="732" fill="#23312c" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="141" dy="0">Test failure paths</tspan></text><text x="88" y="800" fill="#23312c" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="88" dy="0">Verify status and response.</tspan></text><rect x="610" y="680" width="532" height="220" rx="16" fill="white" stroke="#246344" stroke-width="1.5"/><circle cx="655" cy="725" r="24" fill="#246344"/><text x="642" y="733" fill="white" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="642" dy="0">06</tspan></text><text x="695" y="732" fill="#23312c" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="695" dy="0">Observe real use</tspan></text><text x="642" y="800" fill="#23312c" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="642" dy="0">Maintain what clients need.</tspan></text><text x="56" y="956" fill="#246344" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="56" dy="0">Keep the baseline, the changed source and every test attempt.</tspan></text></svg>