<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Your first useful Grok Bot</title><desc id="desc">1. Create one Bot: Give it a focused role and a clear output format.; 2. Run one task: Use a small brief and sources you can inspect.; 3. Check the evidence: Open sources and correct missing or unsupported facts.; 4. Save the method: Test the skill before adding a schedule.</desc><rect width="1200" height="900" fill="#f6f3e9"/><path d="M1010 0h190v190L1010 0Z" fill="#ed886c"/><text x="65" y="70" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#285345">AI SUPERPOWER · FIELD GUIDE</text><text x="65" y="150" font-family="Georgia,serif" font-size="55" fill="#173d32">Your first useful Grok Bot</text><text x="65" y="200" font-family="Arial,sans-serif" font-size="24" fill="#486158">One clear task. A result you can check. A method you can reuse.</text><rect x="65" y="260" width="520" height="220" rx="20" fill="#e7ecc9"/><circle cx="113" cy="310" r="24" fill="#173d32"/><text x="113" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">1</text><text x="150" y="320" font-family="Georgia,serif" font-size="31" fill="#173d32">Create one Bot</text><text x="95" y="372" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Give it a focused role and a clear</text><text x="95" y="404" font-family="Arial,sans-serif" font-size="24" fill="#294d40">output format.</text><rect x="615" y="260" width="520" height="220" rx="20" fill="#f2d4c8"/><circle cx="663" cy="310" r="24" fill="#173d32"/><text x="663" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">2</text><text x="700" y="320" font-family="Georgia,serif" font-size="31" fill="#173d32">Run one task</text><text x="645" y="372" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Use a small brief and sources you can</text><text x="645" y="404" font-family="Arial,sans-serif" font-size="24" fill="#294d40">inspect.</text><rect x="65" y="515" width="520" height="220" rx="20" fill="#dce9e0"/><circle cx="113" cy="565" r="24" fill="#173d32"/><text x="113" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">3</text><text x="150" y="575" font-family="Georgia,serif" font-size="31" fill="#173d32">Check the evidence</text><text x="95" y="627" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Open sources and correct missing or</text><text x="95" y="659" font-family="Arial,sans-serif" font-size="24" fill="#294d40">unsupported facts.</text><rect x="615" y="515" width="520" height="220" rx="20" fill="#ebe1f0"/><circle cx="663" cy="565" r="24" fill="#173d32"/><text x="663" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">4</text><text x="700" y="575" font-family="Georgia,serif" font-size="31" fill="#173d32">Save the method</text><text x="645" y="627" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Test the skill before adding a</text><text x="645" y="659" font-family="Arial,sans-serif" font-size="24" fill="#294d40">schedule.</text><path d="M65 815h1070" stroke="#a6b8ae"/><text x="65" y="854" font-family="Arial,sans-serif" font-size="21" fill="#486158">Finish one useful job → review the evidence → improve the next run</text></svg>