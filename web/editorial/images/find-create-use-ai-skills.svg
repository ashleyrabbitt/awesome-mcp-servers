<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 789" role="img" aria-labelledby="super-skill-cover-title super-skill-cover-desc" style="display:block;width:100%;height:auto;max-width:720px;margin:auto"><title id="super-skill-cover-title">Find a skill worth keeping</title><desc id="super-skill-cover-desc">1. Find a focused skill. Search by the output you need.. Inspect instructions and required tools.; 2. Try a realistic example. Give it the facts your usual process needs.. Check the result against those facts.; 3. Reuse what works. Save the method, supply fresh inputs.. Test revisions before expanding the job.; 4. Create when the fit is missing. Brief Skill Creator with your process.. Start small and improve through practice.</desc><rect width="720" height="789" rx="20" fill="#f0f1f7"/><text x="34" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#246344">USEFUL AI BEATS HYPE</text><text x="34" y="94" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#202735">Find a skill worth keeping</text><text x="34" y="130" font-family="Arial,sans-serif" font-size="22" fill="#454e60">One task. A clear method. A checked result.</text><rect x="28" y="158" width="664" height="128" rx="14" fill="white" stroke="#d5d9e5"/><circle cx="65" cy="196" r="21" fill="#246344"/><text x="65" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="103" y="201" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202735">Find a focused skill</text><text x="103" y="236" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Search by the output you need.</text><text x="103" y="267" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Inspect instructions and required tools.</text><path d="M65 289v14m-6-5 6 6 6-6" stroke="#246344" stroke-width="3" fill="none"/><rect x="28" y="309" width="664" height="128" rx="14" fill="white" stroke="#d5d9e5"/><circle cx="65" cy="347" r="21" fill="#246344"/><text x="65" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="103" y="352" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202735">Try a realistic example</text><text x="103" y="387" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Give it the facts your usual process needs.</text><text x="103" y="418" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Check the result against those facts.</text><path d="M65 440v14m-6-5 6 6 6-6" stroke="#246344" stroke-width="3" fill="none"/><rect x="28" y="460" width="664" height="128" rx="14" fill="white" stroke="#d5d9e5"/><circle cx="65" cy="498" r="21" fill="#246344"/><text x="65" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="103" y="503" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202735">Reuse what works</text><text x="103" y="538" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Save the method, supply fresh inputs.</text><text x="103" y="569" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Test revisions before expanding the job.</text><path d="M65 591v14m-6-5 6 6 6-6" stroke="#246344" stroke-width="3" fill="none"/><rect x="28" y="611" width="664" height="128" rx="14" fill="white" stroke="#d5d9e5"/><circle cx="65" cy="649" r="21" fill="#246344"/><text x="65" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">4</text><text x="103" y="654" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202735">Create when the fit is missing</text><text x="103" y="689" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Brief Skill Creator with your process.</text><text x="103" y="720" font-family="Arial,sans-serif" font-size="23" fill="#454e60">Start small and improve through practice.</text></svg>