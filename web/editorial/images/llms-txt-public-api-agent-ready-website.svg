<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">A small, dependable interface</title><desc id="desc">A website task connects to verified public facts and an honest next step. Illustration for AI Superpower.</desc><rect width="1200" height="720" fill="#eaf0d9"/><rect x="32" y="32" width="1136" height="656" rx="20" fill="white" stroke="#246344" stroke-width="2"/><text x="76" y="92" fill="#246344" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="76" dy="0">AI SUPERPOWER / FIELD GUIDE</tspan></text><text x="76" y="158" fill="#23312c" font-size="46" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="76" dy="0">A small, dependable interface</tspan></text><text x="76" y="214" fill="#23312c" font-size="24" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="76" dy="0">Help an assistant make the right next move.</tspan></text><rect x="76" y="290" width="318" height="238" rx="14" fill="#eaf0d9"/><text x="100" y="337" fill="#246344" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="100" dy="0">01  THE TASK</tspan></text><text x="100" y="390" fill="#23312c" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="100" dy="0">Choose one safe</tspan><tspan x="100" dy="38">useful action.</tspan></text><path d="M405 409h23m-8-8 8 8-8 8" stroke="#246344" stroke-width="3" fill="none"/><rect x="441" y="290" width="318" height="238" rx="14" fill="#eaf0d9"/><text x="465" y="337" fill="#246344" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="465" dy="0">02  THE EVIDENCE</tspan></text><text x="465" y="390" fill="#23312c" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="465" dy="0">Inputs, outputs and</tspan><tspan x="465" dy="38">errors.</tspan></text><path d="M770 409h23m-8-8 8 8-8 8" stroke="#246344" stroke-width="3" fill="none"/><rect x="806" y="290" width="318" height="238" rx="14" fill="#eaf0d9"/><text x="830" y="337" fill="#246344" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="830" dy="0">03  THE HANDOFF</tspan></text><text x="830" y="390" fill="#23312c" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="830" dy="0">Maintain what</tspan><tspan x="830" dy="38">clients need.</tspan></text><text x="76" y="588" fill="#246344" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif"><tspan x="76" dy="0">CLEAR FACTS  +  WORKING LINKS  +  VERIFIED OUTCOME</tspan></text><text x="76" y="634" fill="#23312c" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif"><tspan x="76" dy="0">Illustrative workflow · A file is a starting point. A successful task is evidence.</tspan></text></svg>