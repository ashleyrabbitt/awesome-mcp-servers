<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Claude, meet your to-do list</title><desc id="desc">1. Enable access: Update Desktop and enable computer use if eligible.; 2. Name the task: Specify one app, one output and the allowed changes.; 3. Watch the first run: Inspect the app and correct unexpected steps.; 4. Open the result: Check the saved file and record any corrections.</desc><rect width="1200" height="900" fill="#f6f3e9"/><path d="M1010 0h190v190L1010 0Z" fill="#ed886c"/><text x="65" y="70" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#285345">AI SUPERPOWER · FIELD GUIDE</text><text x="65" y="150" font-family="Georgia,serif" font-size="55" fill="#173d32">Claude, meet your to-do list</text><text x="65" y="200" font-family="Arial,sans-serif" font-size="24" fill="#486158">One clear task. A result you can check. A method you can reuse.</text><rect x="65" y="260" width="520" height="220" rx="20" fill="#e7ecc9"/><circle cx="113" cy="310" r="24" fill="#173d32"/><text x="113" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">1</text><text x="150" y="320" font-family="Georgia,serif" font-size="31" fill="#173d32">Enable access</text><text x="95" y="372" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Update Desktop and enable computer</text><text x="95" y="404" font-family="Arial,sans-serif" font-size="24" fill="#294d40">use if eligible.</text><rect x="615" y="260" width="520" height="220" rx="20" fill="#f2d4c8"/><circle cx="663" cy="310" r="24" fill="#173d32"/><text x="663" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">2</text><text x="700" y="320" font-family="Georgia,serif" font-size="31" fill="#173d32">Name the task</text><text x="645" y="372" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Specify one app, one output and the</text><text x="645" y="404" font-family="Arial,sans-serif" font-size="24" fill="#294d40">allowed changes.</text><rect x="65" y="515" width="520" height="220" rx="20" fill="#dce9e0"/><circle cx="113" cy="565" r="24" fill="#173d32"/><text x="113" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">3</text><text x="150" y="575" font-family="Georgia,serif" font-size="31" fill="#173d32">Watch the first run</text><text x="95" y="627" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Inspect the app and correct</text><text x="95" y="659" font-family="Arial,sans-serif" font-size="24" fill="#294d40">unexpected steps.</text><rect x="615" y="515" width="520" height="220" rx="20" fill="#ebe1f0"/><circle cx="663" cy="565" r="24" fill="#173d32"/><text x="663" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">4</text><text x="700" y="575" font-family="Georgia,serif" font-size="31" fill="#173d32">Open the result</text><text x="645" y="627" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Check the saved file and record any</text><text x="645" y="659" font-family="Arial,sans-serif" font-size="24" fill="#294d40">corrections.</text><path d="M65 815h1070" stroke="#a6b8ae"/><text x="65" y="854" font-family="Arial,sans-serif" font-size="21" fill="#486158">Finish one useful job → review the evidence → improve the next run</text></svg>