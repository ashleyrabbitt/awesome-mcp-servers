<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">From a request to a result</title><desc id="desc">1. Define the finish: Name the file, decision or task that will be complete.; 2. Give useful context: Supply approved inputs, sources and a small first batch.; 3. Review the result: Check facts, calculations and what actually changed.; 4. Keep the method: Measure total effort and repeat what works.</desc><rect width="1200" height="900" fill="#f6f3e9"/><path d="M1010 0h190v190L1010 0Z" fill="#ed886c"/><text x="65" y="70" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#285345">AI SUPERPOWER · FIELD GUIDE</text><text x="65" y="150" font-family="Georgia,serif" font-size="55" fill="#173d32">From a request to a result</text><text x="65" y="200" font-family="Arial,sans-serif" font-size="24" fill="#486158">One clear task. A result you can check. A method you can reuse.</text><rect x="65" y="260" width="520" height="220" rx="20" fill="#e7ecc9"/><circle cx="113" cy="310" r="24" fill="#173d32"/><text x="113" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">1</text><text x="150" y="320" font-family="Georgia,serif" font-size="31" fill="#173d32">Define the finish</text><text x="95" y="372" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Name the file, decision or task that</text><text x="95" y="404" font-family="Arial,sans-serif" font-size="24" fill="#294d40">will be complete.</text><rect x="615" y="260" width="520" height="220" rx="20" fill="#f2d4c8"/><circle cx="663" cy="310" r="24" fill="#173d32"/><text x="663" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">2</text><text x="700" y="320" font-family="Georgia,serif" font-size="31" fill="#173d32">Give useful context</text><text x="645" y="372" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Supply approved inputs, sources and a</text><text x="645" y="404" font-family="Arial,sans-serif" font-size="24" fill="#294d40">small first batch.</text><rect x="65" y="515" width="520" height="220" rx="20" fill="#dce9e0"/><circle cx="113" cy="565" r="24" fill="#173d32"/><text x="113" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">3</text><text x="150" y="575" font-family="Georgia,serif" font-size="31" fill="#173d32">Review the result</text><text x="95" y="627" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Check facts, calculations and what</text><text x="95" y="659" font-family="Arial,sans-serif" font-size="24" fill="#294d40">actually changed.</text><rect x="615" y="515" width="520" height="220" rx="20" fill="#ebe1f0"/><circle cx="663" cy="565" r="24" fill="#173d32"/><text x="663" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">4</text><text x="700" y="575" font-family="Georgia,serif" font-size="31" fill="#173d32">Keep the method</text><text x="645" y="627" font-family="Arial,sans-serif" font-size="24" fill="#294d40">Measure total effort and repeat what</text><text x="645" y="659" font-family="Arial,sans-serif" font-size="24" fill="#294d40">works.</text><path d="M65 815h1070" stroke="#a6b8ae"/><text x="65" y="854" font-family="Arial,sans-serif" font-size="21" fill="#486158">Finish one useful job → review the evidence → improve the next run</text></svg>