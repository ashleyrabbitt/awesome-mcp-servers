<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer rounded container -->
  <rect width="64" height="64" rx="16" fill="#09090B" />

  <!-- Subtle background grid pattern representing weave structure -->
  <path d="M16 12v40M28 12v40M40 12v40M52 12v40" stroke="#27272A" stroke-width="1.5" stroke-linecap="round" />
  <path d="M12 16h40M12 28h40M12 40h40M12 52h40" stroke="#27272A" stroke-width="1.5" stroke-linecap="round" />

  <!-- Stylized interwoven warp & weft ribbons forming 'TL' -->
  <!-- Vertical Warp Threads (Indigo / Cobalt) -->
  <rect x="22" y="16" width="6" height="32" rx="3" fill="#6366F1" />
  <rect x="36" y="16" width="6" height="32" rx="3" fill="#4F46E5" />

  <!-- Horizontal Weft Crossing Ribbons (Amber / Gold) -->
  <path d="M14 24h36" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
  <path d="M14 38h36" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />

  <!-- Front interlacing crowns for 3D textile depth -->
  <!-- Top-left warp crown over weft -->
  <rect x="22" y="21.5" width="6" height="5" rx="1.5" fill="#818CF8" />

  <!-- Bottom-right warp crown over weft -->
  <rect x="36" y="35.5" width="6" height="5" rx="1.5" fill="#818CF8" />

  <!-- Central Loom Shuttle Diamond Core -->
  <circle cx="32" cy="31" r="2.5" fill="#FBBF24" />
</svg>
