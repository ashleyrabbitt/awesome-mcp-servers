<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">AI Superpower: four steps from input to reviewed action</title><desc id="desc">Pick one output: Choose a budget with three line items and a clear review question.; Ask for a Sheet: Paste the sample data and request formulas, a totals row and separate assumptions.; Build a Whiteboard: Organize the budget assumptions into Confirmed, Unconfirmed and Owner actions.; Check and export: Recalculate the total yourself, then export the spreadsheet and save the review decision.</desc><rect width="1200" height="1020" fill="#faf7f0"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="20" fill="#284d64" letter-spacing="3">CLAUDE / PRACTICAL WORKFLOW</text><text x="60" y="128" font-family="Georgia,serif" font-size="44" fill="#202c31">Make the work easy to check.</text><rect x="60" y="185" width="525" height="320" rx="16" fill="#fff" stroke="#b9c5c7"/><circle cx="109" cy="239" r="26" fill="#284d64"/><text x="109" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white">01</text><text x="88" y="307" font-family="Arial,sans-serif" font-weight="bold" font-size="27" fill="#202c31">Pick one output</text><text x="88" y="379" font-family="Arial,sans-serif" font-size="23" fill="#40545d">Choose a budget with three line items</text><text x="88" y="410" font-family="Arial,sans-serif" font-size="23" fill="#40545d">and a clear review question.</text><rect x="615" y="185" width="525" height="320" rx="16" fill="#fff" stroke="#b9c5c7"/><circle cx="664" cy="239" r="26" fill="#284d64"/><text x="664" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white">02</text><text x="643" y="307" font-family="Arial,sans-serif" font-weight="bold" font-size="27" fill="#202c31">Ask for a Sheet</text><text x="643" y="379" font-family="Arial,sans-serif" font-size="23" fill="#40545d">Paste the sample data and request</text><text x="643" y="410" font-family="Arial,sans-serif" font-size="23" fill="#40545d">formulas, a totals row and separate</text><text x="643" y="441" font-family="Arial,sans-serif" font-size="23" fill="#40545d">assumptions.</text><rect x="60" y="550" width="525" height="320" rx="16" fill="#fff" stroke="#b9c5c7"/><circle cx="109" cy="604" r="26" fill="#284d64"/><text x="109" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white">03</text><text x="88" y="672" font-family="Arial,sans-serif" font-weight="bold" font-size="27" fill="#202c31">Build a Whiteboard</text><text x="88" y="744" font-family="Arial,sans-serif" font-size="23" fill="#40545d">Organize the budget assumptions into</text><text x="88" y="775" font-family="Arial,sans-serif" font-size="23" fill="#40545d">Confirmed, Unconfirmed and Owner</text><text x="88" y="806" font-family="Arial,sans-serif" font-size="23" fill="#40545d">actions.</text><rect x="615" y="550" width="525" height="320" rx="16" fill="#fff" stroke="#b9c5c7"/><circle cx="664" cy="604" r="26" fill="#284d64"/><text x="664" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white">04</text><text x="643" y="672" font-family="Arial,sans-serif" font-weight="bold" font-size="27" fill="#202c31">Check and export</text><text x="643" y="744" font-family="Arial,sans-serif" font-size="23" fill="#40545d">Recalculate the total yourself, then</text><text x="643" y="775" font-family="Arial,sans-serif" font-size="23" fill="#40545d">export the spreadsheet and save the</text><text x="643" y="806" font-family="Arial,sans-serif" font-size="23" fill="#40545d">review decision.</text><path d="M585 345h30m-13-10 13 10-13 10M585 710h30m-13-10 13 10-13 10" fill="none" stroke="#40545d" stroke-width="3"/><text x="60" y="966" font-family="Arial,sans-serif" font-size="21" fill="#40545d">Original workflow illustration • Sample data, human review, one next action</text></svg>